baseURL                = "https://kyukyu300.github.io/MyPortfolio/"
locale                 = "ko-kr"
title                  = "김규진 포트폴리오"
# Theme i18n support
# See i18n folder for available languages
defaultContentLanguage = "ko"
# Set hasCJKLanguage to true if DefaultContentLanguage is a CJK language
# This will make .Summary and .WordCount behave correctly
hasCJKLanguage         = true

[[module.imports]]
    path = "github.com/CaiJimmy/hugo-theme-stack/v3"

[pagination]
    pagerSize = 3

[permalinks]
    post = "/p/:slug/"
    page = "/:slug/"

[services.disqus]
    shortname = ""
